services:
  web:
    build: .
    ports:
      - "5000:5000"
    environment:
      - FLASK_ENV=production
      - SECRET_KEY=${SECRET_KEY:-dev-secret-key-change-me}
      - DATABASE_URL=postgresql://agc_user:agc_pass@db:5432/agc_db
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./app:/app/app
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=agc_user
      - POSTGRES_PASSWORD=agc_pass
      - POSTGRES_DB=agc_db
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agc_user -d agc_db"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  pgdata:
