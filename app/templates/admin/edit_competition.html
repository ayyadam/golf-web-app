{% extends 'base.html' %}
{% block title %}Edit Competition — Admin{% endblock %}
{% block content %}
<section class="content-section" style="padding-top: 100px;">
    <div class="container">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2>Edit Competition: {{ comp.name }}</h2>
            <a href="{{ url_for('admin.manage_competitions') }}" class="btn btn-outline-success btn-sm">
                <i class="bi bi-arrow-left me-1"></i>Competitions
            </a>
        </div>
        <div class="row justify-content-center">
            <div class="col-lg-8">
                <div class="card-glass p-4">
                    <form method="POST">
                        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                        <div class="mb-3">
                            <label class="form-label">Name</label>
                            <input type="text" class="form-control" name="name" value="{{ comp.name }}" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Date</label>
                            <input type="date" class="form-control" name="date"
                                value="{{ comp.date.strftime('%Y-%m-%d') }}" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Format</label>
                            <select class="form-select" name="format">
                                <option {% if comp.format=='Stableford' %}selected{% endif %}>Stableford</option>
                                <option {% if comp.format=='Medal' %}selected{% endif %}>Medal</option>
                                <option {% if comp.format=='Matchplay' %}selected{% endif %}>Matchplay</option>
                                <option {% if comp.format=='Texas Scramble' %}selected{% endif %}>Texas Scramble
                                </option>
                                <option {% if comp.format=='Betterball' %}selected{% endif %}>Betterball</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Description</label>
                            <textarea class="form-control" name="description" rows="3">{{ comp.description }}</textarea>
                        </div>
                        <div class="mt-4">
                            <button type="submit" class="btn btn-agc"><i class="bi bi-check-circle me-1"></i>Save
                                Changes</button>
                            <a href="{{ url_for('admin.manage_competitions') }}"
                                class="btn btn-agc-outline ms-2">Cancel</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</section>
{% endblock %}
