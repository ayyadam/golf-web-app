name: CI/CD Pipeline

on:
  push:
    branches: [master, develop]
  pull_request:
    branches: [master, develop]

# Opt all jobs into Node.js 24 ahead of GitHub's 2026-06-02 default switch.
# Some actions we depend on (actions/upload-artifact, docker/login-action,
# docker/build-push-action) have not yet published Node 24 majors. This env
# var is the GitHub-recommended bridge until they do.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install flake8
      - run: flake8 app/ tests/ --max-line-length=120 --exclude=__pycache__,migrations

  unit-test:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: lint
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_pass
          POSTGRES_DB: agc_test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test_user -d agc_test_db"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
    env:
      TEST_DATABASE_URL: postgresql://test_user:test_pass@localhost:5432/agc_test_db
      SECRET_KEY: ci-test-secret-key
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Run unit tests
        run: |
          mkdir -p reports
          pytest tests/unit/ -v --tb=short \
            --junitxml=reports/unit-results.xml \
            --html=reports/unit-report.html --self-contained-html \
            --cov=app --cov-report=html:reports/coverage
      - name: Upload test reports
        uses: actions/upload-artifact@v5
        if: always()
        with:
          name: unit-test-reports
          path: reports/

  smoke-test:
    name: Deployability Smoke Test
    runs-on: ubuntu-latest
    needs: unit-test
    steps:
      - uses: actions/checkout@v5
      - name: Build and start compose stack
        run: docker compose up -d --build
      - name: Wait for app to become healthy
        run: |
          for i in $(seq 1 30); do
            if curl -fs http://localhost:5000/ > /dev/null; then
              echo "App healthy on attempt $i"
              exit 0
            fi
            echo "Attempt $i/30 — app not yet ready, sleeping 2s..."
            sleep 2
          done
          echo "App did not become healthy in 60s. Container logs:"
          docker compose logs
          exit 1
      - name: Tear down
        if: always()
        run: docker compose down -v

  # Shift-left assurance (B19): call the external assurance-harness against THIS
  # commit's code, so every change is independently assured before an image is
  # published. The harness is pinned to a ref so its evolution can't surprise-
  # break this pipeline. sut_ref is the PR head on PRs, the pushed SHA otherwise.
  assurance:
    name: Assurance (harness)
    needs: [unit-test, smoke-test]
    permissions:
      contents: read
      security-events: write
    uses: ayyadam/assurance-harness/.github/workflows/assurance.yml@feat/b19-shift-left
    with:
      harness_ref: feat/b19-shift-left
      sut_ref: ${{ github.event.pull_request.head.sha || github.sha }}

  build-and-publish:
    name: Build & Publish Image
    runs-on: ubuntu-latest
    # Gated on assurance: no image is published unless the harness passes.
    needs: [unit-test, smoke-test, assurance]
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v5
      - name: Compute image tags
        id: tags
        run: |
          SHORT_SHA=$(echo "${GITHUB_SHA}" | cut -c1-7)
          DATE=$(date -u +'%Y.%m.%d')
          VERSION_TAG="v${DATE}-${SHORT_SHA}"
          SHA_TAG="sha-${SHORT_SHA}"
          echo "version=${VERSION_TAG}" >> "$GITHUB_OUTPUT"
          echo "sha=${SHA_TAG}" >> "$GITHUB_OUTPUT"
          IMAGE_TAGS="ghcr.io/ayyadam/golf-web-app:${SHA_TAG}"
          if [ "${GITHUB_REF}" = "refs/heads/master" ] && [ "${GITHUB_EVENT_NAME}" = "push" ]; then
            IMAGE_TAGS="${IMAGE_TAGS},ghcr.io/ayyadam/golf-web-app:latest"
          fi
          echo "image_tags=${IMAGE_TAGS}" >> "$GITHUB_OUTPUT"
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.tags.outputs.image_tags }}
      - name: Create GitHub Release
        if: github.ref == 'refs/heads/master' && github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tags.outputs.version }}
          name: Release ${{ steps.tags.outputs.version }}
          body: |
            Container image: `ghcr.io/ayyadam/golf-web-app:${{ steps.tags.outputs.sha }}`

            Commit: ${{ github.sha }}
            Message: ${{ github.event.head_commit.message }}
          generate_release_notes: true
