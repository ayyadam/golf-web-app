name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install flake8
      - run: flake8 app/ tests/ --max-line-length=120 --exclude=__pycache__,migrations

  unit-test:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: lint
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_pass
          POSTGRES_DB: agc_test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test_user -d agc_test_db"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
    env:
      TEST_DATABASE_URL: postgresql://test_user:test_pass@localhost:5432/agc_test_db
      SECRET_KEY: ci-test-secret-key
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Run unit tests
        run: |
          pytest tests/unit/ -v --tb=short \
            --junitxml=reports/unit-results.xml \
            --html=reports/unit-report.html --self-contained-html \
            --cov=app --cov-report=html:reports/coverage
      - name: Upload test reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-test-reports
          path: reports/

  functional-test:
    name: Functional Tests
    runs-on: ubuntu-latest
    needs: unit-test
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_pass
          POSTGRES_DB: agc_test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test_user -d agc_test_db"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
    env:
      TEST_DATABASE_URL: postgresql://test_user:test_pass@localhost:5432/agc_test_db
      SECRET_KEY: ci-test-secret-key
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: python -m playwright install --with-deps chromium
      - name: Run functional tests
        run: |
          pytest tests/functional/ -v --tb=short \
            --junitxml=reports/functional-results.xml \
            --html=reports/functional-report.html --self-contained-html
      - name: Upload test reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: functional-test-reports
          path: reports/

  build-and-release:
    name: Build & Release
    runs-on: ubuntu-latest
    needs: [unit-test, functional-test]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Set version
        id: version
        run: echo "tag=v$(date +'%Y.%m.%d')-$(echo $GITHUB_SHA | cut -c1-7)" >> $GITHUB_OUTPUT
      - name: Build Docker image
        run: docker build -t agc-web:${{ steps.version.outputs.tag }} .
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Release ${{ steps.version.outputs.tag }}
          body: |
            Automated release from commit ${{ github.sha }}
            
            **Changes:** ${{ github.event.head_commit.message }}
          generate_release_notes: true

  deploy:
    name: Deploy (Self-hosted)
    runs-on: self-hosted
    needs: build-and-release
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - name: Deploy with Docker Compose
        run: |
          docker compose down
          docker compose build --no-cache
          docker compose up -d
      - name: Run database migrations
        run: docker compose exec -T web flask db upgrade
      - name: Health check
        run: |
          sleep 5
          curl -f http://localhost:5000/ || exit 1
